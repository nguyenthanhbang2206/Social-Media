services:

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8088
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
    command: start-dev --import-realm
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak-realm-config.json:/opt/keycloak/data/import/realm.json
    depends_on:
      - keycloak-db
    networks:
      - social-network

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - social-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - social-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - social-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: always
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml
    # KHÔNG mở cổng 4318 ra ngoài nữa, để Otel-Collector lo giao tiếp nội bộ
    ports:
      - "3200:3200"
    networks:
      - social-network

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    restart: always
    command: [ "-config.file=/etc/loki/loki-config.yml" ] # Đồng bộ đuôi .yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki # Thêm volume để lưu trữ log không bị mất khi restart
    networks:
      - social-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    command: [ "-config.file=/etc/promtail/promtail-config.yml" ]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - ./logs:/logs
    depends_on:
      - loki
    networks:
      - social-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: always
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4319:4318"  # Máy host gọi vào 4319 -> chạy vào cổng HTTP 4318 của Collector
    depends_on:
      - tempo
    networks:
      - social-network

networks:
  social-network:
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  keycloak_db_data: