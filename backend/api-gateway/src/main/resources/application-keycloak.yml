spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/social-media
          jwk-set-uri: http://localhost:8080/realms/social-media/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://localhost:8080
  realm: social-media
  resource: social-media-web
  credentials:
    secret: ""
  bearer-only: true
  cors: true
  cors-max-age: 3600
  cors-allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  cors-allowed-headers: Authorization,Content-Type,Accept,X-User-Id,X-User-Email
  public-client: true
  use-resource-role-mappings: true
  principal-attribute: preferred_username
