server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-logs

    static_configs:
      - targets:
          - localhost

        labels:
          job: social-media
          __path__: /logs/*.log

    relabel_configs:
      - source_labels: [filename]
        regex: '^.*/([^/]+)\.log$'
        target_label: app
        action: replace