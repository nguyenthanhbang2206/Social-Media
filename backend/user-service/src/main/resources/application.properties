spring.application.name=user-service
server.port=8081

# ??? Database ?????????????????????????????????????????????????????????????????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_media_user}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ??? Service Discovery ????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ??? RabbitMQ ?????????????????????????????????????????????????????????????????
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ??? Keycloak Admin Client ????????????????????????????????????????????????????
# URL c?a Keycloak server (không có trailing slash)
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8088}

# Realm ch?a users c?a ?ng d?ng
keycloak.realm=${KEYCLOAK_REALM:social-media-realm}

# Client ID c?a frontend app (dùng ?? g?i token endpoint)
# Ph?i match v?i clientId trong keycloak-realm-config.json
keycloak.client-id=${KEYCLOAK_CLIENT_ID:social-media-frontend}

# Client secret ? ?? tr?ng n?u client là public (publicClient: true)
# ?i?n vào n?u client là confidential
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

# Keycloak Admin API credentials (dùng ?? t?o user, assign role...)
# Credentials này ph?i kh?p v?i KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD trong docker-compose
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin123}

# ??? Internal Service Communication ??????????????????????????????????????????
# Secret dùng cho Feign calls gi?a các services (không liên quan Keycloak)
internal.auth.secret=${INTERNAL_AUTH_SECRET:change-me-in-production}

# ??? Observability ????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4319/v1/traces}
management.metrics.tags.application=${spring.application.name}
logging.file.name=logs/${spring.application.name}.log
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
